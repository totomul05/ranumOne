name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Susun folder proyek
        run: |
          mkdir -p app/src/main/java/com/ranum/one
          mv AndroidManifest.xml app/src/main/
          mv app.build.gradle.kts app/build.gradle.kts
          mv Data.kt Logic.kt MainActivity.kt app/src/main/java/com/ranum/one/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ranumOne-apk
          path: app/build/outputs/apk/debug/app-debug.apk
